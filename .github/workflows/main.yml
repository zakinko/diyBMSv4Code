name: PlatformIO CI

on:
  push:

jobs:
  job_build_modulecode:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build code for modules
      run: pio run --project-dir=./ATTINYCellModule --project-conf=./ATTINYCellModule/platformio.ini

    - name: Publish Artifacts 1
      uses: actions/upload-artifact@v4
      with:
        name: DIYBMS-Compiled-Module
        path: |
          ./ATTINYCellModule/.pio/build/V*/*.hex
          ./ATTINYCellModule/.pio/build/V*/*.elf
        if-no-files-found: error


  job_build_controller_esp8266:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build code for controller
      run: pio run --project-dir=./ESPController  --environment esp8266_d1mini --project-conf=./ESPController/platformio.ini

    - name: Build File System Image for ESP8266
      run: pio run --project-dir=./ESPController --target buildfs --environment esp8266_d1mini

    # Both binaries are published in one step.  upload-artifact v4 rejects a second
    # upload under a name it has already seen, where v2 merged them, so the firmware
    # and the filesystem image have to be collected after both have been built.
    - name: Publish Artifacts 2
      uses: actions/upload-artifact@v4
      with:
        name: DIYBMS-Compiled-Controller-ESP8266
        path: ./ESPController/.pio/build/*/*.bin
        if-no-files-found: error

  job_zip_code:
    runs-on: ubuntu-latest
    needs: [job_build_modulecode, job_build_controller_esp8266]
    permissions:
      contents: write
    steps:
    - name: Download artifact DIYBMS-Compiled-Controller-ESP8266
      uses: actions/download-artifact@v4
      with:
        name: DIYBMS-Compiled-Controller-ESP8266

    - name: Download artifact DIYBMS-Compiled-Module
      uses: actions/download-artifact@v4
      with:
        name: DIYBMS-Compiled-Module

    - name: Display structure of downloaded files
      run: ls -R

    # Located by name rather than by path.  An artifact is rooted at the least common
    # ancestor of the files it was given, so how much of the directory structure
    # survives depends on how many directories matched - which differs between the two
    # jobs, and is not worth depending on when --junk-paths discards it all anyway.
    - name: ZIP output for release
      run: |
        find . -name 'diybms_controller_firmware_*.bin' -o -name 'diybms_controller_filesystemimage_*.bin' -o -name '*.hex' \
          | xargs zip --junk-paths release.zip
        unzip -l release.zip

    - name: Get current date
      id: date
      run: echo "dt=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV

    - name: Display structure of downloaded files
      run: mv release.zip release_${{ env.dt }}.zip

    # actions/create-release and actions/upload-release-asset were both archived in
    # March 2021; softprops/action-gh-release is one of the replacements their READMEs
    # point at, and it creates the release and attaches the asset in a single step.
    - name: Create Release Files on MASTER branch only
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/master'
      with:
        tag_name: Tag-${{ env.dt }}
        name: Release-${{ env.dt }}
        body: |
          Automatically generated release
        draft: false
        prerelease: false
        files: ./release_${{ env.dt }}.zip
