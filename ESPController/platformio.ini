; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266_d1mini

[env]
framework = arduino
monitor_speed = 115200
;monitor_filters = log2file, default
board_build.flash_mode = dout
extra_scripts = 
        pre:buildscript_versioning.py
        pre:prebuild_compress.py
        pre:prebuild_generate_integrity_hash.py
        pre:prebuild_generate_embedded_files.py

[env:esp8266_d1mini]
; ESP8266 D1 MINI 4M bytes Flash buy from here https://amzn.to/3i1gPIz
; The MINI PRO version also works but is no longer required
; *** ESP8266 CORE for Arduino version 3.1.2
; Pinned like everything else here, so a bump arrives as a reviewed commit.  Upstream held
; this at "@<3.0.0" for issue #121, reported only as "does not compile with espressif V3.x"
; and never diagnosed.  Holding it there is what forced gcc 4.8.2 (2013) on every build,
; which in turn is why the libraries had to be frozen at their 2022 revisions.
platform = espressif8266@4.2.1
board = d1_mini
upload_protocol = esptool
board_build.mcu = esp8266
board_build.f_cpu = 80000000L
upload_speed=250000
upload_port=COM3
board_build.filesystem = littlefs

; platform_packages = 
;         platformio/toolchain-xtensa@2.40802.200502
;         platformio/framework-arduinoespressif8266

build_flags = 
        -DDEBUG_ESP_PORT=Serial1 
        -mtarget-align 
        -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
        -lstdc++
        -DVTABLES_IN_DRAM
        -D NDEBUG
        -fno-exceptions
        -DCORE_DEBUG_LEVEL=0
        -DCOMMS_BAUD_RATE=2400

; 4MB board
board_build.ldscript = eagle.flash.4m3m.ld
; Every dependency is pinned.  These are all tracking branches, so an unpinned build takes
; whatever the library looks like on the day it is cloned, which is how this project
; stopped building: the platform was held at espressif8266 2.x (gcc 4.8.2, 2013) while
; ESPAsyncWebServer moved on to __has_include, which needs gcc 5.  The compiler is no
; longer the constraint, but the pins stay - the point of them is that a change is a
; reviewed commit rather than a surprise - and they are moved forward deliberately.
;
; ESPAsyncTCP is named here although nothing in this project includes it directly.  It
; arrives twice over, as ">=1.2.2" with no owner from AsyncMqttClient - which matches two
; packages, so PlatformIO warns and picks one - and as "me-no-dev/...@^1.2.2" from
; ESPAsyncWebServer.  Naming it makes the choice ours rather than the resolver's; this is
; the ESP32Async fork, which is what the unpinned resolution was already landing on.
lib_deps =
           esp32async/ESPAsyncTCP@2.0.0
           https://github.com/SMFSW/Queue.git#6bd9a4e66ef5
           https://github.com/marvinroger/ESP8266TrueRandom.git#9b9db7ee50a1c9edd73c6a721330d54496e98e88
           https://github.com/marvinroger/async-mqtt-client.git#6aad769b36ca
           esp32async/ESPAsyncWebServer@3.12.0
           https://github.com/bblanchon/ArduinoJson.git#v7.4.3
           https://github.com/stuartpittaway/SerialEncoder.git#f909d311cad31e9580566450cf7d987336d911c8
           https://github.com/WereCatf/PCF8574_ESP.git#96e9ef906fdaeafbb48db96530228df82acc64cf
           https://github.com/PaulStoffregen/Time#a18e50dcea4ee17285d732d39e7bc559482d1d3d
           https://github.com/me-no-dev/ESPAsyncUDP.git#697c75a0255e5dccf91b4ef8b5cc28c569b3bac9
           https://github.com/gmag11/NtpClient.git#db0824634eddc7bc37da6adf8d3069ef4557659b
