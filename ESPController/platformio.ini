; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266_d1mini

[env]
framework = arduino
monitor_speed = 115200
;monitor_filters = log2file, default
board_build.flash_mode = dout
extra_scripts = 
        pre:buildscript_versioning.py
        pre:prebuild_compress.py
        pre:prebuild_generate_integrity_hash.py
        pre:prebuild_generate_embedded_files.py

[env:esp8266_d1mini]
; ESP8266 D1 MINI 4M bytes Flash buy from here https://amzn.to/3i1gPIz
; The MINI PRO version also works but is no longer required
; *** ESP8266 CORE for Arduino version 2.7.4
platform = espressif8266@<3.0.0
board = d1_mini
upload_protocol = esptool
board_build.mcu = esp8266
board_build.f_cpu = 80000000L
upload_speed=250000
upload_port=COM3
board_build.filesystem = littlefs

; platform_packages = 
;         platformio/toolchain-xtensa@2.40802.200502
;         platformio/framework-arduinoespressif8266

build_flags = 
        -DDEBUG_ESP_PORT=Serial1 
        -mtarget-align 
        -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
        -lstdc++
        -DVTABLES_IN_DRAM
        -D NDEBUG
        -fno-exceptions
        -DCORE_DEBUG_LEVEL=0
        -DCOMMS_BAUD_RATE=2400

; 4MB board
board_build.ldscript = eagle.flash.4m3m.ld
; Every dependency is pinned.  These are all tracking branches, so an unpinned build
; takes whatever the library looks like on the day it is cloned, which is how this
; project stopped building: platform is held at espressif8266 2.x (gcc 4.8.2, 2013) but
; ESPAsyncWebServer kept moving and now uses __has_include, which needs gcc 5.  The
; revisions below are the ones current when this code last built, 2022-05.
lib_deps =
           https://github.com/SMFSW/Queue.git#711b832c8f75477e8a37b9d1ec2fb5dc72f38055
           https://github.com/marvinroger/ESP8266TrueRandom.git#9b9db7ee50a1c9edd73c6a721330d54496e98e88
           https://github.com/marvinroger/async-mqtt-client.git#fb9db765ec120d95f3c7c34bf464fb4fe5ea6a8a
           https://github.com/me-no-dev/ESPAsyncWebServer.git#1dde9cf0219de662ed0882c0b6208057f70f105d
           https://github.com/bblanchon/ArduinoJson.git#v6.19.4
           https://github.com/stuartpittaway/SerialEncoder.git#f909d311cad31e9580566450cf7d987336d911c8
           https://github.com/WereCatf/PCF8574_ESP.git#96e9ef906fdaeafbb48db96530228df82acc64cf
           https://github.com/PaulStoffregen/Time#a18e50dcea4ee17285d732d39e7bc559482d1d3d
           https://github.com/me-no-dev/ESPAsyncUDP.git#697c75a0255e5dccf91b4ef8b5cc28c569b3bac9
           https://github.com/gmag11/NtpClient.git#db0824634eddc7bc37da6adf8d3069ef4557659b
